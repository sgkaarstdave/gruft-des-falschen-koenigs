<script>
  if (location.hostname === "sgkaarstdave.github.io") {
    const game = new URL('https://gruft-des-falschen-koenigs.furrybeetle.chatgpt.site/');
    const params = new URLSearchParams(location.search);
    for (const key of ['join', 'room']) {
      const code = params.get(key);
      if (code && /^[a-z0-9]{6}$/i.test(code)) game.searchParams.set(key, code.toUpperCase());
    }
    location.replace(game.href);
    }
</script>
